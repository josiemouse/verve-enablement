<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Triage — Verve</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090d13;
    color: #e2e8f0;
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .container { max-width: 760px; margin: 0 auto; padding: 40px 24px; }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 40px; padding-bottom: 20px;
    border-bottom: 1px solid #1a1f2e;
  }
  .nav-logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 700;
    color: #818cf8; letter-spacing: 0.08em;
    text-decoration: none;
  }
  .nav-back {
    font-size: 12px; color: #475569;
    text-decoration: none; letter-spacing: 0.04em;
    transition: color 0.15s;
  }
  .nav-back:hover { color: #94a3b8; }
  .header { margin-bottom: 32px; }
  .header-tag { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #818cf8;
    animation: pulse 2s infinite; flex-shrink: 0;
  }
  .tag-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: #4b5563;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  h1 { font-size: 26px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; margin-bottom: 8px; }
  .subtitle { color: #475569; font-size: 14px; line-height: 1.5; }
  .card { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  label {
    display: block; font-size: 11px; font-weight: 700;
    color: #4b5563; text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }
  input, textarea {
    width: 100%; background: #090d13;
    border: 1px solid #21262d; border-radius: 8px;
    padding: 10px 14px; color: #f1f5f9;
    font-size: 14px; font-family: 'IBM Plex Sans', sans-serif;
    transition: border-color 0.2s; outline: none;
    margin-bottom: 14px;
  }
  input:focus, textarea:focus { border-color: #818cf8; }
  textarea { resize: vertical; line-height: 1.6; }
  button {
    width: 100%; background: #818cf8; color: #0f0f1a;
    border: none; border-radius: 8px; padding: 11px 20px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.04em; transition: all 0.15s;
  }
  button:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
  button:not(:disabled):hover { background: #a5b4fc; }
  .weights-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
  .weight-card { background: #0d1117; border: 1px solid #1a1f2e; border-radius: 8px; padding: 10px 12px; }
  .weight-dot { width: 8px; height: 8px; border-radius: 50%; margin-bottom: 6px; }
  .weight-pct { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 2px; font-family: 'IBM Plex Mono', monospace; }
  .weight-label
